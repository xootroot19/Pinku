          class LessonDetailScreen extends StatefulWidget {
            final Lesson lesson;
            final VoidCallback onCompleted;

            const LessonDetailScreen({
              super.key,
              required this.lesson,
              required this.onCompleted,
            });

            @override
            State<LessonDetailScreen> createState() =>
                _LessonDetailScreenState();
          }

          class _LessonDetailScreenState extends State<LessonDetailScreen> {
            late ConfettiController _confettiController;
            final Set<int> _completedSteps = {};
            double _progress = 0;
            bool _quizPassed = false;

            @override
            void initState() {
              super.initState();
              _confettiController =
                  ConfettiController(duration: const Duration(seconds: 3));
              _completedSteps.addAll(widget.lesson.completedStepsSet);
              _progress = _completedSteps.length / widget.lesson.steps.length;
            }

            @override
            void dispose() {
              _confettiController.dispose();
              super.dispose();
            }

            void _toggleStep(int index) {
              setState(() {
                if (_completedSteps.contains(index)) {
                  _completedSteps.remove(index);
                  widget.lesson.completedStepsSet.remove(index);
                } else {
                  _completedSteps.add(index);
                  widget.lesson.completedStepsSet.add(index);
                }
                _progress = _completedSteps.length / widget.lesson.steps.length;
                if (_completedSteps.length == widget.lesson.steps.length) {
                  widget.lesson.isCompleted = true;
                  _confettiController.play();
                  widget.onCompleted();
                }
              });
            }

            void _checkQuiz(bool passed) {
              setState(() {
                _quizPassed = passed;
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0D0D1A),
                body: Stack(
                  children: [
                    Container(
                      decoration: const BoxDecoration(
                        gradient: LinearGradient(
                          begin: Alignment.topCenter,
                          end: Alignment.bottomCenter,
                          colors: [
                            Color(0xFF0D0D1A),
                            Color(0xFF1A1A35),
                            Color(0xFF2D1B4E),
                          ],
                        ),
                      ),
                    ),
                    SafeArea(
                      child: Column(
                        children: [
                          _buildHeader(),
                          Expanded(
                            child: ListView.builder(
                              padding: const EdgeInsets.all(20),
                              itemCount: widget.lesson.steps.length + 2,
                              itemBuilder: (context, index) {
                                if (index < widget.lesson.steps.length) {
                                  final step = widget.lesson.steps[index];
                                  final isCompleted =
                                      _completedSteps.contains(index);
                                  return TweenAnimationBuilder<double>(
                                    tween: Tween(begin: 0, end: 1),
                                    duration: Duration(
                                        milliseconds: 300 + (index * 50)),
                                    curve: Curves.easeOut,
                                    builder: (context, value, child) {
                                      return Opacity(
                                        opacity: value,
                                        child: Transform.translate(
                                          offset: Offset(0, 20 * (1 - value)),
                                          child: child,
                                        ),
                                      );
                                    },
                                    child: Card(
                                      margin:
                                          const EdgeInsets.only(bottom: 12),
                                      color: isCompleted
                                          ? const Color(0xFF00D2FF)
                                              .withOpacity(0.1)
                                          : Colors.white.withOpacity(0.05),
                                      shape: RoundedRectangleBorder(
                                        borderRadius: BorderRadius.circular(16),
                                        side: BorderSide(
                                          color: isCompleted
                                              ? const Color(0xFF00D2FF)
                                                  .withOpacity(0.4)
                                              : Colors.white.withOpacity(0.1),
                                        ),
                                      ),
                                      child: ListTile(
                                        leading: AnimatedContainer(
                                          duration: const Duration(
                                              milliseconds: 300),
                                          width: 40,
                                          height: 40,
                                          decoration: BoxDecoration(
                                            shape: BoxShape.circle,
                                            color: isCompleted
                                                ? const Color(0xFF00D2FF)
                                                : Colors.white.withOpacity(0.1),
                                          ),
                                          child: Center(
                                            child: isCompleted
                                                ? const Icon(
                                                    Icons.check_rounded,
                                                    color: Colors.white,
                                                    size: 20,
                                                  )
                                                : Text(
                                                    '${index + 1}',
                                                    style: const TextStyle(
                                                      color: Colors.white,
                                                      fontSize: 16,
                                                      fontWeight:
                                                          FontWeight.bold,
                                                    ),
                                                  ),
                                          ),
                                        ),
                                        title: Text(
                                          step,
                                          style: TextStyle(
