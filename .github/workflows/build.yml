name: Build Pinku APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Criar projeto Flutter
        run: |
          flutter create pinku --platforms=android --org com.parodia.pinku

      - name: Criar app
        shell: bash
        run: |
          cat > pinku/lib/main.dart <<'DART'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const PinkuApp());
          }

          class PinkuApp extends StatelessWidget {
            const PinkuApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Pinku',
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFFFF1768),
                  ),
                  scaffoldBackgroundColor: const Color(0xFFF7F7F9),
                ),
                home: const HomePage(),
              );
            }
          }

          class HomePage extends StatefulWidget {
            const HomePage({super.key});

            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> {
            String nome = 'Alex';
            double saldo = 2450.80;
            bool esconderSaldo = false;

            String dinheiro(double valor) {
              final partes = valor.toStringAsFixed(2).split('.');
              String inteiro = partes[0];

              final buffer = StringBuffer();

              for (int i = 0; i < inteiro.length; i++) {
                if (i > 0 && (inteiro.length - i) % 3 == 0) {
                  buffer.write('.');
                }

                buffer.write(inteiro[i]);
              }

              return 'R\$ ${buffer.toString()},${partes[1]}';
            }

            void mensagem(String texto) {
              ScaffoldMessenger.of(context)
                ..hideCurrentSnackBar()
                ..showSnackBar(
                  SnackBar(
                    content: Text(texto),
                    behavior: SnackBarBehavior.floating,
                  ),
                );
            }

            Future<void> editar() async {
              final nomeController =
                  TextEditingController(text: nome);

              final saldoController = TextEditingController(
                text: saldo.toStringAsFixed(2).replaceAll('.', ','),
              );

              await showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                showDragHandle: true,
                builder: (context) {
                  return Padding(
                    padding: EdgeInsets.fromLTRB(
                      20,
                      10,
                      20,
                      MediaQuery.of(context).viewInsets.bottom + 25,
                    ),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const Text(
                          'Editar conta',
                          style: TextStyle(
                            fontSize: 25,
                            fontWeight: FontWeight.w900,
                          ),
                        ),

                        const SizedBox(height: 20),

                        TextField(
                          controller: nomeController,
                          decoration: const InputDecoration(
                            labelText: 'Nome',
                            prefixIcon:
                                Icon(Icons.person_outline),
                            border: OutlineInputBorder(),
                          ),
                        ),

                        const SizedBox(height: 15),

                        TextField(
                          controller: saldoController,
                          keyboardType:
                              const TextInputType.numberWithOptions(
                            decimal: true,
                          ),
                          decoration: const InputDecoration(
                            labelText: 'Saldo fictício',
                            prefixText: 'R\$ ',
                            prefixIcon:
                                Icon(Icons.account_balance_wallet_outlined),
                            border: OutlineInputBorder(),
                          ),
                        ),

                        const SizedBox(height: 20),

                        FilledButton.icon(
                          style: FilledButton.styleFrom(
                            minimumSize:
                                const Size.fromHeight(55),
                          ),
                          onPressed: () {
                            double? novoSaldo = double.tryParse(
                              saldoController.text
                                  .replaceAll('.', '')
                                  .replaceAll(',', '.'),
                            );

                            setState(() {
                              if (nomeController.text.trim().isNotEmpty) {
                                nome = nomeController.text.trim();
                              }

                              if (novoSaldo != null) {
                                saldo = novoSaldo;
                              }
                            });

                            Navigator.pop(context);
                          },
                          icon: const Icon(Icons.check),
                          label: const Text('Salvar'),
                        ),
                      ],
                    ),
                  );
                },
              );
            }

            void receber() {
              setState(() {
                saldo += 100;
              });

              mensagem(
                '+ R\$ 100,00 fictícios adicionados ✨',
              );
            }

            Future<void> transferir() async {
              final controller = TextEditingController();

              await showDialog(
                context: context,
                builder: (dialogContext) {
                  return AlertDialog(
                    title: const Text(
                      'Transferência fictícia',
                    ),
                    content: TextField(
                      controller: controller,
                      keyboardType:
                          const TextInputType.numberWithOptions(
                        decimal: true,
                      ),
                      decoration: const InputDecoration(
                        labelText: 'Valor',
                        prefixText: 'R\$ ',
                        border: OutlineInputBorder(),
                      ),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.pop(dialogContext);
                        },
                        child: const Text('Cancelar'),
                      ),

                      FilledButton(
                        onPressed: () {
                          final valor = double.tryParse(
                            controller.text
                                .replaceAll('.', '')
                                .replaceAll(',', '.'),
                          );

                          if (valor == null || valor <= 0) {
                            return;
                          }

                          if (valor > saldo) {
                            Navigator.pop(dialogContext);

                            mensagem(
                              'Saldo fictício insuficiente',
                            );

                            return;
                          }

                          setState(() {
                            saldo -= valor;
                          });

                          Navigator.pop(dialogContext);

                          mensagem(
                            'Transferência fictícia realizada',
                          );
                        },
                        child: const Text('Transferir'),
                      ),
                    ],
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: CustomScrollView(
                    physics:
                        const BouncingScrollPhysics(),
                    slivers: [
                      SliverToBoxAdapter(
                        child: cabecalho(),
                      ),

                      SliverToBoxAdapter(
                        child: conta(),
                      ),

                      SliverToBoxAdapter(
                        child: atalhos(),
                      ),

                      SliverToBoxAdapter(
                        child: cartoes(),
                      ),

                      SliverToBoxAdapter(
                        child: aviso(),
                      ),

                      const SliverToBoxAdapter(
                        child: SizedBox(height: 100),
                      ),
                    ],
                  ),
                ),

                floatingActionButton:
                    FloatingActionButton.extended(
                  onPressed: editar,
                  icon: const Icon(Icons.edit),
                  label: const Text('Editar'),
                ),
              );
            }

            Widget cabecalho() {
              return Container(
                padding:
                    const EdgeInsets.fromLTRB(20, 20, 20, 35),
                decoration: const BoxDecoration(
                  gradient: LinearGradient(
                    colors: [
                      Color(0xFFFF3986),
                      Color(0xFFFF1265),
                    ],
                    begin: Alignment.topLeft,
                    end: Alignment.bottomRight,
                  ),
                  borderRadius: BorderRadius.vertical(
                    bottom: Radius.circular(32),
                  ),
                ),
                child: Column(
                  crossAxisAlignment:
                      CrossAxisAlignment.start,
                  children: [
                    Row(
                      children: [
                        GestureDetector(
                          onTap: editar,
                          child: const CircleAvatar(
                            radius: 27,
                            backgroundColor:
                                Color(0x44FFFFFF),
                            child: Icon(
                              Icons.person_outline,
                              color: Colors.white,
                              size: 30,
                            ),
                          ),
                        ),

                        const Spacer(),

                        IconButton(
                          onPressed: () {
                            setState(() {
                              esconderSaldo =
                                  !esconderSaldo;
                            });
                          },
                          icon: AnimatedSwitcher(
                            duration: const Duration(
                              milliseconds: 200,
                            ),
                            child: Icon(
                              esconderSaldo
                                  ? Icons.visibility_off_outlined
                                  : Icons.visibility_outlined,
                              key:
                                  ValueKey(esconderSaldo),
                              color: Colors.white,
                            ),
                          ),
                        ),

                        IconButton(
                          onPressed: () {
                            mensagem(
                              'Este é um app fictício 😄',
                            );
                          },
                          icon: const Icon(
                            Icons.help_outline,
                            color: Colors.white,
                          ),
                        ),
                      ],
                    ),

                    const SizedBox(height: 32),

                    AnimatedSwitcher(
                      duration:
                          const Duration(milliseconds: 350),
                      child: Text(
                        'Olá, $nome',
                        key: ValueKey(nome),
                        style: const TextStyle(
                          color: Colors.white,
                          fontSize: 29,
                          fontWeight: FontWeight.w900,
                        ),
                      ),
                    ),

                    const SizedBox(height: 5),

                    const Text(
                      'Pinku • sua conta de brincadeira',
                      style: TextStyle(
                        color: Color(0xDDFFFFFF),
                        fontWeight: FontWeight.w600,
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget conta() {
              return Padding(
                padding:
                    const EdgeInsets.fromLTRB(18, 18, 18, 0),
                child: Material(
                  color: Colors.white,
                  borderRadius:
                      BorderRadius.circular(24),
                  child: InkWell(
                    borderRadius:
                        BorderRadius.circular(24),
                    onTap: editar,
                    child: Padding(
                      padding:
                          const EdgeInsets.all(22),
                      child: Column(
                        crossAxisAlignment:
                            CrossAxisAlignment.start,
                        children: [
                          const Row(
                            children: [
                              Text(
                                'Conta',
                                style: TextStyle(
                                  fontSize: 22,
                                  fontWeight:
                                      FontWeight.w900,
                                ),
                              ),
                              Spacer(),
                              Icon(
                                Icons.chevron_right,
                              ),
                            ],
                          ),

                          const SizedBox(height: 18),

                          const Text(
                            'Saldo disponível',
                            style: TextStyle(
                              color: Colors.black54,
                            ),
                          ),

                          const SizedBox(height: 5),

                          AnimatedSwitcher(
                            duration: const Duration(
                              milliseconds: 250,
                            ),
                            child: esconderSaldo
                                ? const Text(
                                    '••••••',
                                    key: ValueKey(
                                      'oculto',
                                    ),
                                    style: TextStyle(
                                      fontSize: 31,
                                      fontWeight:
                                          FontWeight.w900,
                                      letterSpacing: 3,
                                    ),
                                  )
                                : TweenAnimationBuilder<
                                    double>(
                                    key:
                                        ValueKey(saldo),
                                    tween: Tween(
                                      begin: 0,
                                      end: saldo,
                                    ),
                                    duration:
                                        const Duration(
                                      milliseconds: 600,
                                    ),
                                    curve:
                                        Curves.easeOut,
                                    builder:
                                        (
                                      context,
                                      valor,
                                      child,
                                    ) {
                                      return Text(
                                        dinheiro(valor),
                                        style:
                                            const TextStyle(
                                          fontSize: 31,
                                          fontWeight:
                                              FontWeight
                                                  .w900,
                                        ),
                                      );
                                    },
                                  ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }

            Widget atalhos() {
              final itens = [
                (
                  Icons.diamond_outlined,
                  'Área Pix',
                  () => mensagem(
                        'Pix apenas de brincadeira',
                      ),
                ),
                (
                  Icons.qr_code_2,
                  'Pagar',
                  () => mensagem(
                        'Pagamento fictício',
                      ),
                ),
                (
                  Icons.add_circle_outline,
                  'Receber',
                  receber,
                ),
                (
                  Icons.send_outlined,
                  'Transferir',
                  transferir,
                ),
              ];

              return SizedBox(
                height: 135,
                child: ListView.separated(
                  scrollDirection: Axis.horizontal,
                  padding:
                      const EdgeInsets.fromLTRB(
                    18,
                    20,
                    18,
                    0,
                  ),
                  itemCount: itens.length,
                  separatorBuilder:
                      (context, index) =>
                          const SizedBox(width: 12),
                  itemBuilder: (context, index) {
                    final item = itens[index];

                    return SizedBox(
                      width: 82,
                      child: Column(
                        children: [
                          Material(
                            color:
                                const Color(0xFFFFE4EE),
                            shape:
                                const CircleBorder(),
                            child: InkWell(
                              customBorder:
                                  const CircleBorder(),
                              onTap: item.$3,
                              child: SizedBox(
                                width: 66,
                                height: 66,
                                child: Icon(
                                  item.$1,
                                  size: 29,
                                ),
                              ),
                            ),
                          ),

                          const SizedBox(height: 8),

                          Text(
                            item.$2,
                            textAlign:
                                TextAlign.center,
                            style: const TextStyle(
                              fontWeight:
                                  FontWeight.w700,
                            ),
                          ),
                        ],
                      ),
                    );
                  },
                ),
              );
            }

            Widget cartoes() {
              return Padding(
                padding:
                    const EdgeInsets.fromLTRB(
                  18,
                  8,
                  18,
                  0,
                ),
                child: Material(
                  color:
                      const Color(0xFFFFE8F0),
                  borderRadius:
                      BorderRadius.circular(22),
                  child: InkWell(
                    borderRadius:
                        BorderRadius.circular(22),
                    onTap: () {
                      mensagem(
                        'Nenhum cartão real conectado',
                      );
                    },
                    child: const Padding(
                      padding:
                          EdgeInsets.all(20),
                      child: Row(
                        children: [
                          Icon(
                            Icons.credit_card,
                          ),
                          SizedBox(width: 14),
                          Text(
                            'Meus cartões',
                            style: TextStyle(
                              fontSize: 17,
                              fontWeight:
                                  FontWeight.w800,
                            ),
                          ),
                          Spacer(),
                          Icon(
                            Icons.chevron_right,
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }

            Widget aviso() {
              return Padding(
                padding:
                    const EdgeInsets.all(18),
                child: Container(
                  padding:
                      const EdgeInsets.all(22),
                  decoration: BoxDecoration(
                    gradient:
                        const LinearGradient(
                      colors: [
                        Color(0xFFFFEDF4),
                        Color(0xFFFFDCE9),
                      ],
                    ),
                    borderRadius:
                        BorderRadius.circular(24),
                  ),
                  child: const Column(
                    crossAxisAlignment:
                        CrossAxisAlignment.start,
                    children: [
                      Icon(
                        Icons.auto_awesome,
                        size: 30,
                      ),

                      SizedBox(height: 25),

                      Text(
                        'Pinku',
                        style: TextStyle(
                          fontSize: 22,
                          fontWeight:
                              FontWeight.w900,
                        ),
                      ),

                      SizedBox(height: 5),

                      Text(
                        'Aplicativo fictício/paródia. '
                        'Os valores não representam '
                        'dinheiro real.',
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          DART

      - name: Baixar dependências
        working-directory: pinku
        run: flutter pub get

      - name: Compilar APK
        working-directory: pinku
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Pinku-APK
          path: pinku/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
