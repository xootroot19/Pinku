name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter project
        run: |
          flutter create . --platforms android --project-name chupa_rola_app
          mkdir -p lib

      - name: Write pubspec.yaml
        run: |
          cat > pubspec.yaml << 'PUBSPEC_EOF'
          name: chupa_rola_app
          description: Guia do Oral Perfeito
          publish_to: 'none'
          version: 2.0.0+2
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            confetti: ^0.7.0
          flutter:
            uses-material-design: true
          PUBSPEC_EOF

      - name: Write main.dart
        run: |
          cat > lib/main.dart << 'DART_EOF'
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:confetti/confetti.dart';

          void main() => runApp(const ChupaRolaApp());

          class ChupaRolaApp extends StatelessWidget {
            const ChupaRolaApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Manual da Boqueteira',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  primaryColor: const Color(0xFFFF2E63),
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFFFF2E63),
                    primary: const Color(0xFFFF2E63),
                    secondary: const Color(0xFF00D2FF),
                    brightness: Brightness.dark,
                  ),
                  scaffoldBackgroundColor: const Color(0xFF0D0D1A),
                  fontFamily: 'sans-serif',
                  useMaterial3: true,
                ),
                home: const SplashScreen(),
              );
            }
          }

          // ==================== SPLASH SCREEN ====================

          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});

            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen>
              with SingleTickerProviderStateMixin {
            late AnimationController _controller;
            late Animation<double> _scale;
            late Animation<double> _fade;

            @override
            void initState() {
              super.initState();
              _controller = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 2000),
              );
              _scale = Tween<double>(begin: 0.5, end: 1.0).animate(
                CurvedAnimation(parent: _controller, curve: Curves.elasticOut),
              );
              _fade = Tween<double>(begin: 0.0, end: 1.0).animate(
                CurvedAnimation(parent: _controller, curve: Curves.easeIn),
              );
              _controller.forward();
              Future.delayed(const Duration(milliseconds: 2500), () {
                Navigator.pushReplacement(
                  context,
                  PageRouteBuilder(
                    pageBuilder: (context, animation, secondaryAnimation) =>
                        const OnboardingScreen(),
                    transitionsBuilder:
                        (context, animation, secondaryAnimation, child) {
                      return FadeTransition(
                        opacity: animation,
                        child: ScaleTransition(
                          scale: Tween<double>(begin: 1.1, end: 1.0)
                              .animate(animation),
                          child: child,
                        ),
                      );
                    },
                  ),
                );
              });
            }

            @override
            void dispose() {
              _controller.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(
                      begin: Alignment.topLeft,
                      end: Alignment.bottomRight,
                      colors: [
                        Color(0xFF0D0D1A),
                        Color(0xFF1A1A35),
                        Color(0xFF2D1B4E),
                      ],
                    ),
                  ),
                  child: Center(
                    child: FadeTransition(
                      opacity: _fade,
                      child: ScaleTransition(
                        scale: _scale,
                        child: Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            Container(
                              width: 120,
                              height: 120,
                              decoration: BoxDecoration(
                                shape: BoxShape.circle,
                                gradient: const LinearGradient(
                                  colors: [Color(0xFFFF2E63), Color(0xFFFF6B9D)],
                                ),
                                boxShadow: [
                                  BoxShadow(
                                    color: const Color(0xFFFF2E63).withOpacity(0.5),
                                    blurRadius: 40,
                                    spreadRadius: 10,
                                  ),
                                ],
                              ),
                              child: const Icon(
                                Icons.favorite_rounded,
                                size: 60,
                                color: Colors.white,
                              ),
                            ),
                            const SizedBox(height: 24),
                            const Text(
                              'MANUAL DA',
                              style: TextStyle(
                                fontSize: 14,
                                letterSpacing: 6,
                                color: Colors.white70,
                                fontWeight: FontWeight.w300,
                              ),
                            ),
                            const Text(
                              'BOQUETEIRA',
                              style: TextStyle(
                                fontSize: 36,
                                fontWeight: FontWeight.w900,
                                color: Color(0xFFFF2E63),
                                letterSpacing: 2,
                              ),
                            ),
                            const SizedBox(height: 12),
                            Text(
                              'aprende a mamar gostoso, viado',
                              style: TextStyle(
                                fontSize: 14,
                                color: Colors.white.withOpacity(0.6),
                                fontStyle: FontStyle.italic,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          // ==================== ONBOARDING ====================

          class OnboardingScreen extends StatefulWidget {
            const OnboardingScreen({super.key});

            @override
            State<OnboardingScreen> createState() => _OnboardingScreenState();
          }

          class _OnboardingScreenState extends State<OnboardingScreen> {
            final PageController _pageController = PageController();
            int _currentPage = 0;

            final List<Map<String, String>> _pages = [
              {
                'icon': '👅',
                'title': 'Chega de fazer feio',
                'description':
                    'Tu já cansou de pagar mico na hora H? Aqui tu vai aprender a dar aquele boquete que faz o cara gozar e te chamar pra repetir.',
              },
              {
                'icon': '💅',
                'title': 'Do básico ao babado',
                'description':
                    'Desde preparar a boquinha até engolir o caneco inteiro. Técnica, ritmo, pressão, tudo que a bicha precisa saber pra virar referência.',
              },
              {
                'icon': '🛡️',
                'title': 'Segurança primeiro, bebê',
                'description':
                    'Camisinha, PrEP, testagem. Porque boqueteira de verdade se cuida. Prazer é bom, mas saúde é tudo.',
              },
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(
                      begin: Alignment.topCenter,
                      end: Alignment.bottomCenter,
                      colors: [
                        Color(0xFF0D0D1A),
                        Color(0xFF1A1A35),
                        Color(0xFF2D1B4E),
                      ],
                    ),
                  ),
                  child: SafeArea(
                    child: Column(
                      children: [
                        Expanded(
                          child: PageView.builder(
                            controller: _pageController,
                            itemCount: _pages.length,
                            onPageChanged: (index) {
                              setState(() {
                                _currentPage = index;
                              });
                            },
                            itemBuilder: (context, index) {
                              final page = _pages[index];
                              return AnimatedBuilder(
                                animation: _pageController,
                                builder: (context, child) {
                                  double pageOffset = 0;
                                  if (_pageController.position.haveDimensions) {
                                    pageOffset = _pageController.page! - index;
                                  }
                                  final scale = 1 - (pageOffset.abs() * 0.2);
                                  final opacity = 1 - (pageOffset.abs() * 0.4);
                                  return Transform.scale(
                                    scale: scale.clamp(0.8, 1.0),
                                    child: Opacity(
                                      opacity: opacity.clamp(0.6, 1.0),
                                      child: Padding(
                                        padding: const EdgeInsets.all(32),
                                        child: Column(
                                          mainAxisAlignment:
                                              MainAxisAlignment.center,
                                          children: [
                                            Container(
                                              width: 120,
                                              height: 120,
                                              decoration: BoxDecoration(
                                                shape: BoxShape.circle,
                                                color: Colors.white
                                                    .withOpacity(0.05),
                                                border: Border.all(
                                                  color: const Color(0xFFFF2E63)
                                                      .withOpacity(0.3),
                                                  width: 2,
                                                ),
                                              ),
                                              child: Center(
                                                child: Text(
                                                  page['icon']!,
                                                  style: const TextStyle(
                                                      fontSize: 56),
                                                ),
                                              ),
                                            ),
                                            const SizedBox(height: 32),
                                            Text(
                                              page['title']!,
                                              textAlign: TextAlign.center,
                                              style: const TextStyle(
                                                fontSize: 28,
                                                fontWeight: FontWeight.bold,
                                                color: Colors.white,
                                              ),
                                            ),
                                            const SizedBox(height: 16),
                                            Text(
                                              page['description']!,
                                              textAlign: TextAlign.center,
                                              style: TextStyle(
                                                fontSize: 16,
                                                height: 1.5,
                                                color: Colors.white
                                                    .withOpacity(0.7),
                                              ),
                                            ),
                                          ],
                                        ),
                                      ),
                                    ),
                                  );
                                },
                              );
                            },
                          ),
                        ),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: List.generate(
                            _pages.length,
                            (index) => AnimatedContainer(
                              duration: const Duration(milliseconds: 300),
                              margin: const EdgeInsets.symmetric(horizontal: 4),
                              width: _currentPage == index ? 24 : 8,
                              height: 8,
                              decoration: BoxDecoration(
                                borderRadius: BorderRadius.circular(4),
                                color: _currentPage == index
                                    ? const Color(0xFFFF2E63)
                                    : Colors.white.withOpacity(0.3),
                              ),
                            ),
                          ),
                        ),
                        Padding(
                          padding: const EdgeInsets.all(24),
                          child: SizedBox(
                            width: double.infinity,
                            height: 56,
                            child: ElevatedButton(
                              onPressed: () {
                                if (_currentPage < _pages.length - 1) {
                                  _pageController.nextPage(
                                    duration:
                                        const Duration(milliseconds: 500),
                                    curve: Curves.easeInOut,
                                  );
                                } else {
                                  Navigator.pushReplacement(
                                    context,
                                    PageRouteBuilder(
                                      pageBuilder: (context, animation,
                                              secondaryAnimation) =>
                                          const MainScreen(),
                                      transitionsBuilder: (context, animation,
                                          secondaryAnimation, child) {
                                        return FadeTransition(
                                          opacity: animation,
                                          child: child,
                                        );
                                      },
                                    ),
                                  );
                                }
                              },
                              style: ElevatedButton.styleFrom(
                                backgroundColor: const Color(0xFFFF2E63),
                                shape: RoundedRectangleBorder(
                                  borderRadius: BorderRadius.circular(28),
                                ),
                                elevation: 8,
                                shadowColor: const Color(0xFFFF2E63)
                                    .withOpacity(0.4),
                              ),
                              child: Text(
                                _currentPage < _pages.length - 1
                                    ? 'Próximo'
                                    : 'Bora aprender, viado!',
                                style: const TextStyle(
                                  fontSize: 16,
                                  fontWeight: FontWeight.bold,
                                  color: Colors.white,
                                ),
                              ),
                            ),
                          ),
                        ),
                      ],
                    ),
                  ),
                );
              }
            }
          }

          // ==================== MAIN SCREEN ====================

          class MainScreen extends StatefulWidget {
            const MainScreen({super.key});

            @override
            State<MainScreen> createState() => _MainScreenState();
          }

          class _MainScreenState extends State<MainScreen> {
            int _selectedIndex = 0;
            int _completedLessons = 0;
            int _totalSteps = 0;
            int _completedSteps = 0;

            @override
            void initState() {
              super.initState();
              _totalSteps = lessons.fold(0, (sum, l) => sum + l.steps.length);
            }

            void _updateProgress() {
              setState(() {
                _completedLessons = lessons.where((l) => l.isCompleted).length;
                _completedSteps =
                    lessons.fold(0, (sum, l) => sum + l.completedSteps);
              });
            }

            void _onLessonCompleted() {
              _updateProgress();
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: const Text(
                    'Aiiii que orgulho! Mais uma lição mamada com sucesso! 💅',
                    textAlign: TextAlign.center,
                  ),
                  backgroundColor: const Color(0xFFFF2E63),
                  duration: const Duration(seconds: 3),
                  behavior: SnackBarBehavior.floating,
                  shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(16),
                  ),
                  margin: const EdgeInsets.all(16),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final screens = [
                _buildHomeScreen(),
                _buildProgressScreen(),
                _buildTipsScreen(),
              ];

              return Scaffold(
                body: AnimatedSwitcher(
                  duration: const Duration(milliseconds: 400),
                  transitionBuilder: (child, animation) {
                    return FadeTransition(
                      opacity: animation,
                      child: SlideTransition(
                        position: Tween<Offset>(
                          begin: const Offset(0.05, 0),
                          end: Offset.zero,
                        ).animate(animation),
                        child: child,
                      ),
                    );
                  },
                  child: screens[_selectedIndex],
                ),
                bottomNavigationBar: Container(
                  decoration: BoxDecoration(
                    color: const Color(0xFF1A1A35),
                    boxShadow: [
                      BoxShadow(
                        color: Colors.black.withOpacity(0.3),
                        blurRadius: 20,
                        spreadRadius: 5,
                      ),
                    ],
                  ),
                  child: BottomNavigationBar(
                    currentIndex: _selectedIndex,
                    onTap: (index) {
                      setState(() {
                        _selectedIndex = index;
                      });
                    },
                    backgroundColor: Colors.transparent,
                    selectedItemColor: const Color(0xFFFF2E63),
                    unselectedItemColor: Colors.white.withOpacity(0.4),
                    selectedFontSize: 12,
                    unselectedFontSize: 10,
                    type: BottomNavigationBarType.fixed,
                    elevation: 0,
                    items: const [
                      BottomNavigationBarItem(
                        icon: Icon(Icons.menu_book_rounded),
                        label: 'Lições',
                      ),
                      BottomNavigationBarItem(
                        icon: Icon(Icons.insights_rounded),
                        label: 'Progresso',
                      ),
                      BottomNavigationBarItem(
                        icon: Icon(Icons.tips_and_updates_rounded),
                        label: 'Dicas',
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _buildHomeScreen() {
              return Container(
                key: const ValueKey('home'),
                decoration: const BoxDecoration(
                  gradient: LinearGradient(
                    begin: Alignment.topLeft,
                    end: Alignment.bottomRight,
                    colors: [
                      Color(0xFF0D0D1A),
                      Color(0xFF1A1A35),
                      Color(0xFF2D1B4E),
                    ],
                  ),
                ),
                child: SafeArea(
                  child: CustomScrollView(
                    slivers: [
                      SliverToBoxAdapter(
                        child: Padding(
                          padding: const EdgeInsets.all(20),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Row(
                                children: [
                                  Expanded(
                                    child: Column(
                                      crossAxisAlignment:
                                          CrossAxisAlignment.start,
                                      children: [
                                        const Text(
                                          'Olá, boqueteira!',
                                          style: TextStyle(
                                            fontSize: 28,
                                            fontWeight: FontWeight.w900,
                                            color: Colors.white,
                                          ),
                                        ),
                                        const SizedBox(height: 4),
                                        Text(
                                          'pronta pra mamar gostoso hoje?',
                                          style: TextStyle(
                                            fontSize: 14,
                                            color: Colors.white.withOpacity(0.6),
                                            fontStyle: FontStyle.italic,
                                          ),
                                        ),
                                      ],
                                    ),
                                  ),
                                  Container(
                                    width: 48,
                                    height: 48,
                                    decoration: BoxDecoration(
                                      shape: BoxShape.circle,
                                      gradient: const LinearGradient(
                                        colors: [
                                          Color(0xFFFF2E63),
                                          Color(0xFFFF6B9D)
                                        ],
                                      ),
                                      boxShadow: [
                                        BoxShadow(
                                          color: const Color(0xFFFF2E63)
                                              .withOpacity(0.4),
                                          blurRadius: 16,
                                        ),
                                      ],
                                    ),
                                    child: const Icon(
                                      Icons.person_rounded,
                                      color: Colors.white,
                                      size: 24,
                                    ),
                                  ),
                                ],
                              ),
                              const SizedBox(height: 24),
                              Container(
                                padding: const EdgeInsets.all(20),
                                decoration: BoxDecoration(
                                  gradient: LinearGradient(
                                    colors: [
                                      const Color(0xFFFF2E63).withOpacity(0.2),
                                      const Color(0xFF00D2FF).withOpacity(0.1),
                                    ],
                                  ),
                                  borderRadius: BorderRadius.circular(20),
                                  border: Border.all(
                                    color: const Color(0xFFFF2E63)
                                        .withOpacity(0.3),
                                  ),
                                ),
                                child: Row(
                                  children: [
                                    const Icon(
                                      Icons.local_fire_department_rounded,
                                      color: Color(0xFFFF2E63),
                                      size: 40,
                                    ),
                                    const SizedBox(width: 16),
                                    Expanded(
                                      child: Column(
                                        crossAxisAlignment:
                                            CrossAxisAlignment.start,
                                        children: [
                                          const Text(
                                            'Sequência de 3 dias',
                                            style: TextStyle(
                                              fontSize: 16,
                                              fontWeight: FontWeight.bold,
                                              color: Colors.white,
                                            ),
                                          ),
                                          const SizedBox(height: 4),
                                          Text(
                                            'Continua mamando! Falta 1 dia pra bater recorde.',
                                            style: TextStyle(
                                              fontSize: 12,
                                              color: Colors.white.withOpacity(0.6),
                                            ),
                                          ),
                                        ],
                                      ),
                                    ),
                                    Text(
                                      '🔥',
                                      style: const TextStyle(fontSize: 32),
                                    ),
                                  ],
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                      SliverPadding(
                        padding: const EdgeInsets.symmetric(horizontal: 20),
                        sliver: SliverList(
                          delegate: SliverChildBuilderDelegate(
                            (context, index) {
                              final lesson = lessons[index];
                              return _buildLessonCard(lesson, index);
                            },
                            childCount: lessons.length,
                          ),
                        ),
                      ),
                      const SliverToBoxAdapter(child: SizedBox(height: 24)),
                    ],
                  ),
                ),
              );
            }

            Widget _buildLessonCard(Lesson lesson, int index) {
              return TweenAnimationBuilder<double>(
                tween: Tween(begin: 0, end: 1),
                duration: Duration(milliseconds: 400 + (index * 100)),
                curve: Curves.easeOut,
                builder: (context, value, child) {
                  return Opacity(
                    opacity: value,
                    child: Transform.translate(
                      offset: Offset(0, 30 * (1 - value)),
                      child: child,
                    ),
                  );
                },
                child: Card(
                  margin: const EdgeInsets.only(bottom: 16),
                  color: Colors.white.withOpacity(0.05),
                  shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(20),
                    side: BorderSide(
                      color: lesson.isCompleted
                          ? const Color(0xFF00D2FF).withOpacity(0.4)
                          : Colors.white.withOpacity(0.1),
                    ),
                  ),
                  child: ListTile(
                    contentPadding: const EdgeInsets.all(16),
                    leading: Container(
                      width: 56,
                      height: 56,
                      decoration: BoxDecoration(
                        gradient: lesson.isCompleted
                            ? const LinearGradient(
                                colors: [Color(0xFF00D2FF), Color(0xFF00E5FF)])
                            : LinearGradient(
                                colors: [
                                  const Color(0xFFFF2E63).withOpacity(0.3),
                                  const Color(0xFFFF6B9D).withOpacity(0.2),
                                ],
                              ),
                        borderRadius: BorderRadius.circular(16),
                      ),
                      child: Center(
                        child: Text(
                          lesson.icon,
                          style: const TextStyle(fontSize: 28),
                        ),
                      ),
                    ),
                    title: Text(
                      lesson.title,
                      style: const TextStyle(
                        fontWeight: FontWeight.bold,
                        color: Colors.white,
                        fontSize: 18,
                      ),
                    ),
                    subtitle: Text(
                      lesson.description,
                      style: TextStyle(
                        color: Colors.white.withOpacity(0.5),
                        fontSize: 13,
                      ),
                    ),
                    trailing: lesson.isCompleted
                        ? const Icon(
                            Icons.check_circle_rounded,
                            color: Color(0xFF00D2FF),
                            size: 28,
                          )
                        : const Icon(
                            Icons.chevron_right_rounded,
                            color: Color(0xFFFF2E63),
                            size: 28,
                          ),
                    onTap: () {
                      Navigator.push(
                        context,
                        PageRouteBuilder(
                          pageBuilder: (context, animation, secondaryAnimation) =>
                              LessonDetailScreen(
                            lesson: lesson,
                            onCompleted: _onLessonCompleted,
                          ),
                          transitionsBuilder:
                              (context, animation, secondaryAnimation, child) {
                            return FadeTransition(
                              opacity: animation,
                              child: SlideTransition(
                                position: Tween<Offset>(
                                  begin: const Offset(0.2, 0),
                                  end: Offset.zero,
                                ).animate(
                                  CurvedAnimation(
                                    parent: animation,
                                    curve: Curves.easeOutCubic,
                                  ),
                                ),
                                child: child,
                              ),
                            );
                          },
                        ),
                      );
                    },
                  ),
                ),
              );
            }

            Widget _buildProgressScreen() {
              double progressPercent = _totalSteps > 0
                  ? (_completedSteps / _totalSteps).clamp(0.0, 1.0)
                  : 0.0;

              return Container(
                key: const ValueKey('progress'),
                decoration: const BoxDecoration(
                  gradient: LinearGradient(
                    begin: Alignment.topLeft,
                    end: Alignment.bottomRight,
                    colors: [
                      Color(0xFF0D0D1A),
                      Color(0xFF1A1A35),
                      Color(0xFF2D1B4E),
                    ],
                  ),
                ),
                child: SafeArea(
                  child: ListView(
                    padding: const EdgeInsets.all(20),
                    children: [
                      const Text(
                        'Seu Progresso',
                        style: TextStyle(
                          fontSize: 28,
                          fontWeight: FontWeight.w900,
                          color: Colors.white,
                        ),
                      ),
                      const SizedBox(height: 24),
                      Center(
                        child: TweenAnimationBuilder<double>(
                          tween: Tween(begin: 0, end: progressPercent),
                          duration: const Duration(milliseconds: 1500),
                          curve: Curves.easeOutCubic,
                          builder: (context, value, child) {
                            return Container(
                              width: 180,
                              height: 180,
                              decoration: BoxDecoration(
                                shape: BoxShape.circle,
                                color: Colors.white.withOpacity(0.05),
                                border: Border.all(
                                  color: Colors.white.withOpacity(0.1),
                                  width: 2,
                                ),
                              ),
                              child: Stack(
                                alignment: Alignment.center,
                                children: [
                                  SizedBox(
                                    width: 160,
                                    height: 160,
                                    child: CircularProgressIndicator(
                                      value: value,
                                      strokeWidth: 8,
                                      backgroundColor:
                                          Colors.white.withOpacity(0.1),
                                      color: const Color(0xFFFF2E63),
                                      strokeCap: StrokeCap.round,
                                    ),
                                  ),
                                  Column(
                                    mainAxisAlignment: MainAxisAlignment.center,
                                    children: [
                                      Text(
                                        '${(value * 100).toInt()}%',
                                        style: const TextStyle(
                                          fontSize: 36,
                                          fontWeight: FontWeight.w900,
                                          color: Colors.white,
                                        ),
                                      ),
                                      Text(
                                        'concluído',
                                        style: TextStyle(
                                          fontSize: 12,
                                          color: Colors.white.withOpacity(0.5),
                                        ),
                                      ),
                                    ],
                                  ),
                                ],
                              ),
                            );
                          },
                        ),
                      ),
                      const SizedBox(height: 32),
                      Row(
