name: Build Image Downloader APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # -------------------------------------------------------
      # CHECKOUT
      # -------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # JAVA
      # Sem cache aqui!
      # O projeto Gradle ainda não existe neste momento.
      # -------------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # -------------------------------------------------------
      # FLUTTER
      # O flutter-action possui cache próprio do Flutter/Pub.
      # -------------------------------------------------------

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Mostrar versões
        run: |
          java -version
          flutter --version

      # -------------------------------------------------------
      # CRIAR PROJETO
      # -------------------------------------------------------

      - name: Criar projeto Flutter
        run: |
          flutter create \
            --platforms=android \
            --org=com.imagebulk \
            image_bulk

      # -------------------------------------------------------
      # AGORA o projeto Gradle existe.
      # Portanto o cache pode ser criado com segurança.
      # -------------------------------------------------------

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('image_bulk/android/**/*.gradle*', 'image_bulk/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # -------------------------------------------------------
      # PUBSPEC
      # -------------------------------------------------------

      - name: Criar pubspec
        working-directory: image_bulk
        run: |
          cat > pubspec.yaml <<'EOF'
          name: image_bulk
          description: Bulk image downloader
          publish_to: "none"

          version: 1.0.0+1

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter

            http: ^1.2.2
            html: ^0.15.4
            path_provider: ^2.1.5

          flutter:
            uses-material-design: true
          EOF

      # -------------------------------------------------------
      # APP
      # -------------------------------------------------------

      - name: Criar aplicativo
        working-directory: image_bulk
        run: |
          cat > lib/main.dart <<'EOF'
          import 'dart:io';

          import 'package:flutter/material.dart';
          import 'package:html/parser.dart' as html_parser;
          import 'package:http/http.dart' as http;
          import 'package:path_provider/path_provider.dart';

          void main() {
            runApp(const ImageBulkApp());
          }

          class ImageBulkApp extends StatelessWidget {
            const ImageBulkApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Image Bulk',
                theme: ThemeData(
                  colorSchemeSeed: Colors.blue,
                  useMaterial3: true,
                ),
                home: const DownloaderPage(),
              );
            }
          }

          class DownloaderPage extends StatefulWidget {
            const DownloaderPage({super.key});

            @override
            State<DownloaderPage> createState() =>
                _DownloaderPageState();
          }

          class _DownloaderPageState
              extends State<DownloaderPage> {

            final urlController = TextEditingController();

            final List<String> logs = [];

            bool running = false;

            int pages = 0;
            int images = 0;
            int downloaded = 0;

            static const int maxPages = 200;
            static const int maxImages = 5000;

            @override
            void dispose() {
              urlController.dispose();
              super.dispose();
            }

            void addLog(String message) {
              if (!mounted) return;

              setState(() {
                logs.add(message);

                if (logs.length > 300) {
                  logs.removeAt(0);
                }
              });
            }

            Future<void> start() async {
              var url = urlController.text.trim();

              if (url.isEmpty) {
                addLog('Digite a URL do site.');
                return;
              }

              if (!url.startsWith('http://') &&
                  !url.startsWith('https://')) {
                url = 'https://$url';
              }

              final startUri = Uri.tryParse(url);

              if (startUri == null ||
                  startUri.host.isEmpty) {
                addLog('URL inválida.');
                return;
              }

              setState(() {
                running = true;

                logs.clear();

                pages = 0;
                images = 0;
                downloaded = 0;
              });

              try {
                await crawl(startUri);
              } catch (e) {
                addLog('Erro geral: $e');
              } finally {
                if (mounted) {
                  setState(() {
                    running = false;
                  });
                }
              }
            }

            Future<void> crawl(Uri startUri) async {
              final client = http.Client();

              final host =
                  startUri.host.toLowerCase();

              final queue = <Uri>[
                startUri,
              ];

              final visited = <String>{};

              final imageUrls = <String>{};

              addLog('Iniciando...');
              addLog('Domínio: $host');

              try {
                while (
                    queue.isNotEmpty &&
                    visited.length < maxPages &&
                    imageUrls.length < maxImages) {

                  final current =
                      queue.removeAt(0)
                          .replace(fragment: '');

                  final currentString =
                      current.toString();

                  if (visited.contains(currentString)) {
                    continue;
                  }

                  if (current.scheme != 'http' &&
                      current.scheme != 'https') {
                    continue;
                  }

                  if (current.host.toLowerCase() != host) {
                    continue;
                  }

                  visited.add(currentString);

                  if (mounted) {
                    setState(() {
                      pages = visited.length;
                    });
                  }

                  addLog(
                    'Página ${visited.length}: '
                    '${current.path}',
                  );

                  try {
                    final response =
                        await client.get(
                      current,
                      headers: const {
                        'User-Agent':
                            'Mozilla/5.0 '
                            'ImageBulkDownloader/1.0',
                      },
                    ).timeout(
                      const Duration(seconds: 15),
                    );

                    if (response.statusCode < 200 ||
                        response.statusCode >= 400) {
                      continue;
                    }

                    final contentType =
                        response.headers[
                                'content-type'] ??
                            '';

                    if (!contentType
                        .toLowerCase()
                        .contains('text/html')) {
                      continue;
                    }

                    final document =
                        html_parser.parse(
                      response.body,
                    );

                    // -----------------------------
                    // IMG
                    // -----------------------------

                    for (final img
                        in document
                            .querySelectorAll('img')) {

                      final candidates = [
                        img.attributes['src'],
                        img.attributes['data-src'],
                        img.attributes[
                            'data-original'],
                        img.attributes[
                            'data-lazy-src'],
                      ];

                      for (final candidate
                          in candidates) {

                        if (candidate == null ||
                            candidate.trim().isEmpty) {
                          continue;
                        }

                        try {
                          final uri =
                              current.resolve(
                            candidate.trim(),
                          );

                          if (uri.scheme == 'http' ||
                              uri.scheme ==
                                  'https') {
                            imageUrls.add(
                              uri
                                  .replace(
                                    fragment: '',
                                  )
                                  .toString(),
                            );
                          }
                        } catch (_) {}
                      }

                      final srcset =
                          img.attributes[
                                  'srcset'] ??
                              img.attributes[
                                  'data-srcset'];

                      if (srcset != null) {
                        parseSrcSet(
                          srcset,
                          current,
                          imageUrls,
                        );
                      }

                      if (imageUrls.length >=
                          maxImages) {
                        break;
                      }
                    }

                    // -----------------------------
                    // SOURCE / PICTURE
                    // -----------------------------

                    for (final source
                        in document.querySelectorAll(
                            'source[srcset]')) {

                      final srcset =
                          source.attributes[
                              'srcset'];

                      if (srcset != null) {
                        parseSrcSet(
                          srcset,
                          current,
                          imageUrls,
                        );
                      }
                    }

                    // -----------------------------
                    // LINKS
                    // -----------------------------

                    for (final anchor
                        in document.querySelectorAll(
                            'a[href]')) {

                      final href =
                          anchor.attributes['href'];

                      if (href == null ||
                          href.trim().isEmpty) {
                        continue;
                      }

                      try {
                        final uri =
                            current
                                .resolve(
                                  href.trim(),
                                )
                                .replace(
                                  fragment: '',
                                );

                        if (
                            (uri.scheme == 'http' ||
                                uri.scheme ==
                                    'https') &&
                            uri.host.toLowerCase() ==
                                host &&
                            !visited.contains(
                              uri.toString(),
                            )) {

                          queue.add(uri);
                        }
                      } catch (_) {}
                    }

                    if (mounted) {
                      setState(() {
                        images =
                            imageUrls.length;
                      });
                    }

                  } catch (e) {
                    addLog(
                      'Falhou página: '
                      '${current.toString()}',
                    );
                  }
                }

                addLog('');
                addLog(
                  '${imageUrls.length} '
                  'imagens encontradas.',
                );

                await downloadImages(
                  client,
                  imageUrls.toList(),
                  host,
                );

              } finally {
                client.close();
              }
            }

            void parseSrcSet(
              String srcset,
              Uri page,
              Set<String> output,
            ) {
              final parts =
                  srcset.split(',');

              for (final part in parts) {
                final trimmed =
                    part.trim();

                if (trimmed.isEmpty) {
                  continue;
                }

                final candidate =
                    trimmed
                        .split(
                          RegExp(r'\s+'),
                        )
                        .first;

                try {
                  final uri =
                      page.resolve(candidate);

                  if (uri.scheme == 'http' ||
                      uri.scheme == 'https') {

                    output.add(
                      uri
                          .replace(fragment: '')
                          .toString(),
                    );
                  }
                } catch (_) {}
              }
            }

            Future<void> downloadImages(
              http.Client client,
              List<String> imageUrls,
              String host,
            ) async {

              final root =
                  await getApplicationDocumentsDirectory();

              final safeHost =
                  host.replaceAll(
                RegExp(
                  r'[^a-zA-Z0-9._-]',
                ),
                '_',
              );

              final directory =
                  Directory(
                '${root.path}/images/$safeHost',
              );

              await directory.create(
                recursive: true,
              );

              addLog('');
              addLog('Baixando imagens...');

              for (
                var i = 0;
                i < imageUrls.length;
                i++
              ) {
                final imageUrl =
                    imageUrls[i];

                try {
                  final uri =
                      Uri.parse(imageUrl);

                  final response =
                      await client.get(
                    uri,
                    headers: const {
                      'User-Agent':
                          'Mozilla/5.0 '
                          'ImageBulkDownloader/1.0',
                    },
                  ).timeout(
                    const Duration(
                      seconds: 30,
                    ),
                  );

                  if (response.statusCode < 200 ||
                      response.statusCode >= 400) {
                    continue;
                  }

                  final type =
                      response.headers[
                              'content-type'] ??
                          '';

                  if (!type
                      .toLowerCase()
                      .startsWith('image/')) {
                    continue;
                  }

                  String filename;

                  if (uri.pathSegments.isNotEmpty) {
                    filename =
                        uri.pathSegments.last;
                  } else {
                    filename = '';
                  }

                  filename =
                      filename.replaceAll(
                    RegExp(
                      r'[^a-zA-Z0-9._-]',
                    ),
                    '_',
                  );

                  if (filename.isEmpty ||
                      !filename.contains('.')) {

                    filename =
                        'image_${i + 1}'
                        '${extensionFromType(type)}';
                  }

                  var file =
                      File(
                    '${directory.path}/$filename',
                  );

                  if (await file.exists()) {
                    final dot =
                        filename.lastIndexOf('.');

                    if (dot > 0) {
                      final name =
                          filename.substring(
                            0,
                            dot,
                          );

                      final extension =
                          filename.substring(dot);

                      file = File(
                        '${directory.path}/'
                        '${name}_${i + 1}'
                        '$extension',
                      );
                    } else {
                      file = File(
                        '${directory.path}/'
                        '${filename}_${i + 1}',
                      );
                    }
                  }

                  await file.writeAsBytes(
                    response.bodyBytes,
                    flush: true,
                  );

                  if (mounted) {
                    setState(() {
                      downloaded++;
                    });
                  }

                  addLog(
                    '$downloaded/'
                    '${imageUrls.length} '
                    '$filename',
                  );

                } catch (_) {
                  addLog(
                    'Falhou imagem: $imageUrl',
                  );
                }
              }

              addLog('');
              addLog('CONCLUÍDO');
              addLog(
                '$downloaded imagens baixadas.',
              );
              addLog(
                'Pasta interna:',
              );
              addLog(
                directory.path,
              );
            }

            String extensionFromType(
              String type,
            ) {
              final normalized =
                  type
                      .toLowerCase()
                      .split(';')
                      .first;

              if (normalized.contains('jpeg')) {
                return '.jpg';
              }

              if (normalized.contains('png')) {
                return '.png';
              }

              if (normalized.contains('webp')) {
                return '.webp';
              }

              if (normalized.contains('gif')) {
                return '.gif';
              }

              if (normalized.contains('avif')) {
                return '.avif';
              }

              if (normalized.contains('svg')) {
                return '.svg';
              }

              return '.img';
            }

            @override
            Widget build(
              BuildContext context,
            ) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'Image Bulk',
                  ),
                ),
                body: SafeArea(
                  child: Padding(
                    padding:
                        const EdgeInsets.all(16),
                    child: Column(
                      children: [

                        TextField(
                          controller:
                              urlController,
                          enabled: !running,
                          autocorrect: false,
                          keyboardType:
                              TextInputType.url,
                          decoration:
                              const InputDecoration(
                            labelText:
                                'URL do seu site',
                            hintText:
                                'https://meusite.com',
                            border:
                                OutlineInputBorder(),
                          ),
                        ),

                        const SizedBox(
                          height: 12,
                        ),

                        SizedBox(
                          width:
                              double.infinity,
                          height: 52,
                          child:
                              FilledButton.icon(
                            onPressed:
                                running
                                    ? null
                                    : start,
                            icon: running
                                ? const SizedBox(
                                    width: 20,
                                    height: 20,
                                    child:
                                        CircularProgressIndicator(
                                      strokeWidth:
                                          2,
                                    ),
                                  )
                                : const Icon(
                                    Icons
                                        .download,
                                  ),
                            label: Text(
                              running
                                  ? 'Processando...'
                                  : 'Baixar imagens',
                            ),
                          ),
                        ),

                        const SizedBox(
                          height: 16,
                        ),

                        Row(
                          mainAxisAlignment:
                              MainAxisAlignment
                                  .spaceEvenly,
                          children: [
                            stat(
                              'Páginas',
                              pages,
                            ),
                            stat(
                              'Imagens',
                              images,
                            ),
                            stat(
                              'Baixadas',
                              downloaded,
                            ),
                          ],
                        ),

                        const Divider(
                          height: 30,
                        ),

                        Expanded(
                          child:
                              ListView.builder(
                            itemCount:
                                logs.length,
                            itemBuilder:
                                (
                              context,
                              index,
                            ) {
                              return Padding(
                                padding:
                                    const EdgeInsets
                                        .symmetric(
                                  vertical: 2,
                                ),
                                child: Text(
                                  logs[index],
                                  style:
                                      const TextStyle(
                                    fontSize: 12,
                                  ),
                                ),
                              );
                            },
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget stat(
              String label,
              int value,
            ) {
              return Column(
                children: [
                  Text(
                    '$value',
                    style:
                        const TextStyle(
                      fontSize: 22,
                      fontWeight:
                          FontWeight.bold,
                    ),
                  ),
                  Text(label),
                ],
              );
            }
          }
          EOF

      # -------------------------------------------------------
      # INTERNET NO APK RELEASE
      # -------------------------------------------------------

      - name: Adicionar permissão INTERNET
        working-directory: image_bulk
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET"/>'
          )

          if permission not in text:
              end = text.find(">")

              text = (
                  text[:end + 1]
                  + "\n    "
                  + permission
                  + text[end + 1:]
              )

              path.write_text(
                  text,
                  encoding="utf-8"
              )

          print(
              path.read_text(
                  encoding="utf-8"
              )
          )
          PY

      # -------------------------------------------------------
      # DEPENDÊNCIAS
      # -------------------------------------------------------

      - name: Flutter Pub Get
        working-directory: image_bulk
        run: |
          flutter pub get

      # -------------------------------------------------------
      # ANALISAR ANTES DE PERDER TEMPO COMPILANDO
      # -------------------------------------------------------

      - name: Flutter Analyze
        working-directory: image_bulk
        run: |
          flutter analyze

      # -------------------------------------------------------
      # BUILD
      # -------------------------------------------------------

      - name: Build APK Release
        working-directory: image_bulk
        run: |
          flutter build apk \
            --release \
            --no-pub

      # -------------------------------------------------------
      # CONFIRMAR ARQUIVO
      # -------------------------------------------------------

      - name: Verificar APK
        run: |
          echo "APK gerado:"
          ls -lah \
            image_bulk/build/app/outputs/flutter-apk/

          test -f \
            image_bulk/build/app/outputs/flutter-apk/app-release.apk

      # -------------------------------------------------------
      # ARTIFACT
      # -------------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageBulkDownloader-APK
          path: image_bulk/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
