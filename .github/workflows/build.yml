              required this.steps,
              required this.tip,
              required this.warning,
              required this.quizQuestion,
              required this.quizOptions,
              required this.quizCorrectAnswer,
              this.isCompleted = false,
              Set<int>? completedStepsSet,
            }) : completedStepsSet = completedStepsSet ?? {};

            int get completedSteps => completedStepsSet.length;
          }

