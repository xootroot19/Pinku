                                          onPressed: () => _toggleStep(index),
                                        ),
                                        onTap: () => _toggleStep(index),
                                      ),
                                    ),
                                  );
                                } else if (index ==
                                    widget.lesson.steps.length) {
                                  return _buildTipAndWarning();
                                } else {
                                  return _buildQuizSection();
                                }
                              },
                            ),
