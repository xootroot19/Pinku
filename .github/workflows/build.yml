name: Build Image Downloader APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Criar projeto Flutter
        run: |
          flutter create --platforms=android image_bulk
          cd image_bulk

          cat > pubspec.yaml <<'EOF'
          name: image_bulk
          description: Bulk image downloader for own websites
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.2
            html: ^0.15.4
            path_provider: ^2.1.5

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
          EOF

          cat > lib/main.dart <<'EOF'
          import 'dart:async';
          import 'dart:io';

          import 'package:flutter/material.dart';
          import 'package:html/parser.dart' as html_parser;
          import 'package:http/http.dart' as http;
          import 'package:path_provider/path_provider.dart';

          void main() {
            runApp(const BulkImageApp());
          }

          class BulkImageApp extends StatelessWidget {
            const BulkImageApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Image Bulk',
                theme: ThemeData(
                  colorSchemeSeed: Colors.blue,
                  useMaterial3: true,
                ),
                home: const DownloaderPage(),
              );
            }
          }

          class DownloaderPage extends StatefulWidget {
            const DownloaderPage({super.key});

            @override
            State<DownloaderPage> createState() => _DownloaderPageState();
          }

          class _DownloaderPageState extends State<DownloaderPage> {
            final controller = TextEditingController();

            final List<String> logs = [];

            bool running = false;

            int pagesFound = 0;
            int imagesFound = 0;
            int downloaded = 0;

            static const int maxPages = 200;
            static const int maxImages = 5000;

            @override
            void dispose() {
              controller.dispose();
              super.dispose();
            }

            void log(String message) {
              if (!mounted) return;

              setState(() {
                logs.insert(0, message);

                if (logs.length > 200) {
                  logs.removeLast();
                }
              });
            }

            Future<void> start() async {
              var text = controller.text.trim();

              if (text.isEmpty) {
                log('Digite uma URL.');
                return;
              }

              if (!text.startsWith('http://') &&
                  !text.startsWith('https://')) {
                text = 'https://$text';
              }

              final startUri = Uri.tryParse(text);

              if (startUri == null || startUri.host.isEmpty) {
                log('URL inválida.');
                return;
              }

              setState(() {
                running = true;
                logs.clear();
                pagesFound = 0;
                imagesFound = 0;
                downloaded = 0;
              });

              try {
                await crawl(startUri);
              } catch (e) {
                log('Erro: $e');
              } finally {
                if (mounted) {
                  setState(() {
                    running = false;
                  });
                }
              }
            }

            Future<void> crawl(Uri startUri) async {
              final client = http.Client();

              final host = startUri.host.toLowerCase();

              final queue = <Uri>[startUri];

              final visited = <String>{};
              final imageUrls = <String>{};

              log('Site: ${startUri.toString()}');
              log('Procurando páginas...');

              try {
                while (queue.isNotEmpty &&
                    visited.length < maxPages &&
                    imageUrls.length < maxImages) {
                  final current = queue.removeAt(0);

                  final normalized = current.replace(fragment: '');

                  if (visited.contains(normalized.toString())) {
                    continue;
                  }

                  if (normalized.host.toLowerCase() != host) {
                    continue;
                  }

                  visited.add(normalized.toString());

                  if (mounted) {
                    setState(() {
                      pagesFound = visited.length;
                    });
                  }

                  try {
                    final response = await client.get(
                      normalized,
                      headers: {
                        'User-Agent':
                            'Mozilla/5.0 ImageBulkDownloader/1.0',
                      },
                    ).timeout(
                      const Duration(seconds: 15),
                    );

                    if (response.statusCode < 200 ||
                        response.statusCode >= 400) {
                      continue;
                    }

                    final contentType =
                        response.headers['content-type'] ?? '';

                    if (!contentType.contains('text/html')) {
                      continue;
                    }

                    final document =
                        html_parser.parse(response.body);

                    for (final img
                        in document.querySelectorAll('img')) {
                      final values = [
                        img.attributes['src'],
                        img.attributes['data-src'],
                        img.attributes['data-original'],
                        img.attributes['data-lazy-src'],
                      ];

                      for (final value in values) {
                        if (value == null ||
                            value.trim().isEmpty) {
                          continue;
                        }

                        final uri = normalized.resolve(
                          value.trim(),
                        );

                        if (uri.scheme == 'http' ||
                            uri.scheme == 'https') {
                          imageUrls.add(
                            uri.replace(fragment: '').toString(),
                          );
                        }
                      }

                      final srcset =
                          img.attributes['srcset'] ??
                          img.attributes['data-srcset'];

                      if (srcset != null) {
                        for (final part in srcset.split(',')) {
                          final value =
                              part.trim().split(RegExp(r'\s+')).first;

                          if (value.isEmpty) continue;

                          final uri =
                              normalized.resolve(value);

                          if (uri.scheme == 'http' ||
                              uri.scheme == 'https') {
                            imageUrls.add(
                              uri
                                  .replace(fragment: '')
                                  .toString(),
                            );
                          }
                        }
                      }

                      if (imageUrls.length >= maxImages) {
                        break;
                      }
                    }

                    for (final source
                        in document.querySelectorAll('source')) {
                      final srcset =
                          source.attributes['srcset'];

                      if (srcset == null) continue;

                      for (final part in srcset.split(',')) {
                        final value =
                            part.trim().split(RegExp(r'\s+')).first;

                        if (value.isEmpty) continue;

                        final uri = normalized.resolve(value);

                        if (uri.scheme == 'http' ||
                            uri.scheme == 'https') {
                          imageUrls.add(
                            uri.replace(fragment: '').toString(),
                          );
                        }
                      }
                    }

                    if (mounted) {
                      setState(() {
                        imagesFound = imageUrls.length;
                      });
                    }

                    for (final anchor
                        in document.querySelectorAll('a[href]')) {
                      final href =
                          anchor.attributes['href'];

                      if (href == null || href.isEmpty) {
                        continue;
                      }

                      final link =
                          normalized.resolve(href);

                      final clean =
                          link.replace(fragment: '');

                      if ((clean.scheme == 'http' ||
                              clean.scheme == 'https') &&
                          clean.host.toLowerCase() == host &&
                          !visited.contains(clean.toString())) {
                        queue.add(clean);
                      }
                    }
                  } catch (e) {
                    log(
                      'Falhou página: ${normalized.toString()}',
                    );
                  }
                }

                log(
                  '${imageUrls.length} imagens encontradas.',
                );

                await downloadImages(
                  client,
                  imageUrls.toList(),
                  host,
                );
              } finally {
                client.close();
              }
            }

            Future<void> downloadImages(
              http.Client client,
              List<String> images,
              String host,
            ) async {
              final root =
                  await getApplicationDocumentsDirectory();

              final safeHost = host.replaceAll(
                RegExp(r'[^a-zA-Z0-9._-]'),
                '_',
              );

              final directory = Directory(
                '${root.path}/downloads/$safeHost',
              );

              await directory.create(recursive: true);

              log('Baixando imagens...');

              for (var i = 0; i < images.length; i++) {
                final imageUrl = images[i];

                try {
                  final uri = Uri.parse(imageUrl);

                  final response = await client.get(
                    uri,
                    headers: {
                      'User-Agent':
                          'Mozilla/5.0 ImageBulkDownloader/1.0',
                    },
                  ).timeout(
                    const Duration(seconds: 30),
                  );

                  if (response.statusCode < 200 ||
                      response.statusCode >= 400) {
                    continue;
                  }

                  final type =
                      response.headers['content-type'] ?? '';

                  if (!type.toLowerCase().startsWith('image/')) {
                    continue;
                  }

                  var fileName =
                      uri.pathSegments.isNotEmpty
                          ? uri.pathSegments.last
                          : '';

                  fileName = fileName.replaceAll(
                    RegExp(r'[^a-zA-Z0-9._-]'),
                    '_',
                  );

                  String extension = '';

                  if (!fileName.contains('.')) {
                    extension =
                        extensionFromContentType(type);

                    fileName =
                        'image_${i + 1}$extension';
                  }

                  if (fileName.isEmpty) {
                    extension =
                        extensionFromContentType(type);

                    fileName =
                        'image_${i + 1}$extension';
                  }

                  var file = File(
                    '${directory.path}/$fileName',
                  );

                  if (await file.exists()) {
                    final dot = fileName.lastIndexOf('.');

                    if (dot > 0) {
                      final name =
                          fileName.substring(0, dot);

                      final ext =
                          fileName.substring(dot);

                      file = File(
                        '${directory.path}/${name}_${i + 1}$ext',
                      );
                    } else {
                      file = File(
                        '${directory.path}/${fileName}_${i + 1}',
                      );
                    }
                  }

                  await file.writeAsBytes(
                    response.bodyBytes,
                    flush: true,
                  );

                  if (mounted) {
                    setState(() {
                      downloaded++;
                    });
                  }

                  log(
                    '${i + 1}/${images.length} - ${file.path.split('/').last}',
                  );
                } catch (_) {
                  log('Falhou: $imageUrl');
                }
              }

              log('');
              log('Concluído.');
              log('$downloaded imagens baixadas.');
              log('Pasta: ${directory.path}');
            }

            String extensionFromContentType(String type) {
              final normalized =
                  type.toLowerCase().split(';').first;

              if (normalized.contains('jpeg')) {
                return '.jpg';
              }

              if (normalized.contains('png')) {
                return '.png';
              }

              if (normalized.contains('webp')) {
                return '.webp';
              }

              if (normalized.contains('gif')) {
                return '.gif';
              }

              if (normalized.contains('avif')) {
                return '.avif';
              }

              if (normalized.contains('svg')) {
                return '.svg';
              }

              return '.img';
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'Image Bulk Downloader',
                  ),
                ),
                body: SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      children: [
                        TextField(
                          controller: controller,
                          enabled: !running,
                          keyboardType: TextInputType.url,
                          autocorrect: false,
                          decoration: const InputDecoration(
                            labelText: 'URL do seu site',
                            hintText: 'https://meusite.com',
                            border: OutlineInputBorder(),
                          ),
                        ),

                        const SizedBox(height: 12),

                        SizedBox(
                          width: double.infinity,
                          height: 52,
                          child: FilledButton.icon(
                            onPressed:
                                running ? null : start,
                            icon: running
                                ? const SizedBox(
                                    width: 20,
                                    height: 20,
                                    child:
                                        CircularProgressIndicator(
                                      strokeWidth: 2,
                                    ),
                                  )
                                : const Icon(
                                    Icons.download,
                                  ),
                            label: Text(
                              running
                                  ? 'Processando...'
                                  : 'Baixar imagens',
                            ),
                          ),
                        ),

                        const SizedBox(height: 16),

                        Row(
                          mainAxisAlignment:
                              MainAxisAlignment.spaceEvenly,
                          children: [
                            counter(
                              'Páginas',
                              pagesFound,
                            ),
                            counter(
                              'Imagens',
                              imagesFound,
                            ),
                            counter(
                              'Baixadas',
                              downloaded,
                            ),
                          ],
                        ),

                        const Divider(height: 30),

                        Expanded(
                          child: ListView.builder(
                            reverse: true,
                            itemCount: logs.length,
                            itemBuilder: (context, index) {
                              return Padding(
                                padding:
                                    const EdgeInsets.symmetric(
                                  vertical: 2,
                                ),
                                child: Text(
                                  logs[
                                      logs.length -
                                          index -
                                          1],
                                  style: const TextStyle(
                                    fontSize: 12,
                                  ),
                                ),
                              );
                            },
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget counter(
              String label,
              int value,
            ) {
              return Column(
                children: [
                  Text(
                    '$value',
                    style: const TextStyle(
                      fontSize: 22,
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  Text(label),
                ],
              );
            }
          }
          EOF

      - name: Adicionar permissão de Internet
        run: |
          python3 - <<'PY'
          path = "image_bulk/android/app/src/main/AndroidManifest.xml"

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in data:
              data = data.replace(
                  "<manifest",
                  "<manifest",
                  1
              )

              pos = data.find(">")
              data = (
                  data[:pos + 1]
                  + "\n    "
                  + permission
                  + data[pos + 1:]
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(data)
          PY

      - name: Instalar packages
        working-directory: image_bulk
        run: flutter pub get

      - name: Verificar Flutter
        working-directory: image_bulk
        run: |
          flutter --version
          flutter doctor -v

      - name: Build APK
        working-directory: image_bulk
        run: flutter build apk --release

      - name: Mostrar APK
        run: |
          ls -lh image_bulk/build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageBulkDownloader
          path: image_bulk/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
