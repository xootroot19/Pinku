name: Build Luma V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar projeto
        run: |
          flutter create luma_v2 \
            --platforms=android \
            --org app.luma.demo

      - name: Dependencias
        working-directory: luma_v2
        run: |
          flutter pub add image_picker
          flutter pub add shared_preferences
          flutter pub add flutter_local_notifications

      - name: Permissao Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "luma_v2/android/app/src/main/"
              "AndroidManifest.xml"
          )

          text = p.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.'
              'POST_NOTIFICATIONS"/>'
          )

          if permission not in text:
              text = text.replace(
                  "<application",
                  permission + "\n    <application",
                  1,
              )

          p.write_text(text)
          PY

      - name: Criar aplicativo
        shell: bash
        run: |
          cat > luma_v2/lib/main.dart <<'DART'
          import 'dart:io';
          import 'dart:math';

          import 'package:flutter/material.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          final notifications =
              FlutterLocalNotificationsPlugin();

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            const android =
                AndroidInitializationSettings(
              '@mipmap/ic_launcher',
            );

            const settings =
                InitializationSettings(
              android: android,
            );

            // API nova do flutter_local_notifications.
            await notifications.initialize(
              settings: settings,
            );

            final androidPlugin =
                notifications
                    .resolvePlatformSpecificImplementation<
                        AndroidFlutterLocalNotificationsPlugin>();

            await androidPlugin
                ?.requestNotificationsPermission();

            runApp(const LumaApp());
          }

          class LumaApp extends StatelessWidget {
            const LumaApp({super.key});

            @override
            Widget build(BuildContext context) {
              const pink = Color(0xFFE83D8C);

              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Luma Demo',
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme:
                      ColorScheme.fromSeed(
                    seedColor: pink,
                  ),
                  scaffoldBackgroundColor:
                      const Color(0xFFFFF9FC),
                  inputDecorationTheme:
                      InputDecorationTheme(
                    filled: true,
                    fillColor: Colors.white,
                    border: OutlineInputBorder(
                      borderRadius:
                          BorderRadius.circular(20),
                      borderSide: BorderSide.none,
                    ),
                  ),
                ),
                home: const LoginPage(),
              );
            }
          }

          class DemoPerson {
            final String name;
            final int age;
            final String bio;
            final IconData icon;
            final List<String> interests;

            const DemoPerson(
              this.name,
              this.age,
              this.bio,
              this.icon,
              this.interests,
            );
          }

          class LoginPage extends StatefulWidget {
            const LoginPage({super.key});

            @override
            State<LoginPage> createState() =>
                _LoginPageState();
          }

          class _LoginPageState
              extends State<LoginPage> {
            final name =
                TextEditingController();

            bool loading = false;

            Future<void> enter() async {
              setState(() {
                loading = true;
              });

              await Future.delayed(
                const Duration(
                  milliseconds: 500,
                ),
              );

              if (!mounted) return;

              Navigator.pushReplacement(
                context,
                PageRouteBuilder(
                  transitionDuration:
                      const Duration(
                    milliseconds: 450,
                  ),
                  pageBuilder:
                      (_, animation, __) {
                    return FadeTransition(
                      opacity: animation,
                      child: HomePage(
                        userName:
                            name.text.trim().isEmpty
                                ? 'Você'
                                : name.text.trim(),
                      ),
                    );
                  },
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  decoration:
                      const BoxDecoration(
                    gradient: LinearGradient(
                      colors: [
                        Color(0xFFFFF7FA),
                        Color(0xFFFFDFEC),
                        Color(0xFFF6BCD6),
                      ],
                      begin:
                          Alignment.topCenter,
                      end:
                          Alignment.bottomCenter,
                    ),
                  ),
                  child: SafeArea(
                    child: Padding(
                      padding:
                          const EdgeInsets.all(26),
                      child: Column(
                        children: [
                          const Spacer(),

                          TweenAnimationBuilder<double>(
                            tween: Tween(
                              begin: .5,
                              end: 1,
                            ),
                            duration:
                                const Duration(
                              milliseconds: 700,
                            ),
                            curve:
                                Curves.easeOutBack,
                            builder:
                                (_, scale, child) {
                              return Transform.scale(
                                scale: scale,
                                child: child,
                              );
                            },
                            child: Container(
                              width: 94,
                              height: 94,
                              decoration:
                                  const BoxDecoration(
                                gradient:
                                    LinearGradient(
                                  colors: [
                                    Color(
                                      0xFFFF5BA4,
                                    ),
                                    Color(
                                      0xFFD82D83,
                                    ),
                                  ],
                                ),
                                shape:
                                    BoxShape.circle,
                              ),
                              child: const Icon(
                                Icons.favorite_rounded,
                                color: Colors.white,
                                size: 48,
                              ),
                            ),
                          ),

                          const SizedBox(height: 24),

                          const Text(
                            'Luma',
                            style: TextStyle(
                              fontSize: 44,
                              fontWeight:
                                  FontWeight.w900,
                              letterSpacing: -2,
                            ),
                          ),

                          const SizedBox(height: 8),

                          const Text(
                            'Protótipo social com '
                            'personagens fictícios adultos',
                            textAlign:
                                TextAlign.center,
                            style: TextStyle(
                              color:
                                  Colors.black54,
                            ),
                          ),

                          const SizedBox(height: 35),

                          TextField(
                            controller: name,
                            textCapitalization:
                                TextCapitalization
                                    .words,
                            decoration:
                                const InputDecoration(
                              labelText:
                                  'Seu nome no demo',
                              prefixIcon: Icon(
                                Icons
                                    .person_outline_rounded,
                              ),
                            ),
                          ),

                          const SizedBox(height: 14),

                          FilledButton(
                            onPressed:
                                loading
                                    ? null
                                    : enter,
                            style:
                                FilledButton
                                    .styleFrom(
                              minimumSize:
                                  const Size
                                      .fromHeight(58),
                            ),
                            child:
                                AnimatedSwitcher(
                              duration:
                                  const Duration(
                                milliseconds: 200,
                              ),
                              child: loading
                                  ? const SizedBox(
                                      key: ValueKey(
                                        'loading',
                                      ),
                                      width: 22,
                                      height: 22,
                                      child:
                                          CircularProgressIndicator(
                                        strokeWidth: 2,
                                        color:
                                            Colors.white,
                                      ),
                                    )
                                  : const Text(
                                      'Entrar no demo',
                                      key: ValueKey(
                                        'login',
                                      ),
                                    ),
                            ),
                          ),

                          const Spacer(),

                          const Text(
                            'MODO DEMONSTRAÇÃO',
                            style: TextStyle(
                              fontSize: 11,
                              fontWeight:
                                  FontWeight.w900,
                              color:
                                  Colors.black45,
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class HomePage extends StatefulWidget {
            final String userName;

            const HomePage({
              super.key,
              required this.userName,
            });

            @override
            State<HomePage> createState() =>
                _HomePageState();
          }

          class _HomePageState
              extends State<HomePage> {
            final people = const [
              DemoPerson(
                'Lívia',
                22,
                'Fotografia, filmes e cafés.',
                Icons.photo_camera_outlined,
                [
                  'Fotografia',
                  'Cinema',
                  'Café',
                ],
              ),
              DemoPerson(
                'Sofia',
                24,
                'Design, música e viagens.',
                Icons.headphones_rounded,
                [
                  'Design',
                  'Música',
                  'Viagens',
                ],
              ),
              DemoPerson(
                'Maya',
                21,
                'Arte, livros e natureza.',
                Icons.palette_outlined,
                [
                  'Arte',
                  'Livros',
                  'Natureza',
                ],
              ),
              DemoPerson(
                'Clara',
                25,
                'Cinema, comida e passeios.',
                Icons.movie_outlined,
                [
                  'Cinema',
                  'Comida',
                  'Passeios',
                ],
              ),
            ];

            int current = 0;
            int page = 0;

            Offset drag = Offset.zero;

            String demoName = 'Nina';

            String demoMessage =
                'Oi! Esta é uma mensagem '
                'simulada do Luma Demo.';

            String? demoImage;

            @override
            void initState() {
              super.initState();
              loadSettings();
            }

            Future<void>
                loadSettings() async {
              final prefs =
                  await SharedPreferences
                      .getInstance();

              if (!mounted) return;

              setState(() {
                demoName =
                    prefs.getString(
                          'demoName',
                        ) ??
                        'Nina';

                demoMessage =
                    prefs.getString(
                          'demoMessage',
                        ) ??
                        'Oi! Esta é uma '
                            'mensagem simulada '
                            'do Luma Demo.';

                demoImage =
                    prefs.getString(
                  'demoImage',
                );
              });
            }

            Future<void>
                saveSettings() async {
              final prefs =
                  await SharedPreferences
                      .getInstance();

              await prefs.setString(
                'demoName',
                demoName,
              );

              await prefs.setString(
                'demoMessage',
                demoMessage,
              );

              if (demoImage != null) {
                await prefs.setString(
                  'demoImage',
                  demoImage!,
                );
              }
            }

            void snack(String text) {
              ScaffoldMessenger.of(context)
                ..hideCurrentSnackBar()
                ..showSnackBar(
                  SnackBar(
                    content: Text(text),
                    behavior:
                        SnackBarBehavior
                            .floating,
                  ),
                );
            }

            Future<void>
                sendDemoNotification()
                async {
              const details =
                  NotificationDetails(
                android:
                    AndroidNotificationDetails(
                  'luma_demo',
                  'Luma Demo',
                  channelDescription:
                      'Notificações simuladas '
                      'do protótipo Luma',
                  importance:
                      Importance.high,
                  priority:
                      Priority.high,
                ),
              );

              // API nova: todos os argumentos
              // são nomeados.
              await notifications.show(
                id: Random().nextInt(999999),
                title:
                    'Luma Demo • simulação',
                body:
                    '$demoName: $demoMessage',
                notificationDetails:
                    details,
              );
            }

            Future<void>
                openStudio() async {
              final nameController =
                  TextEditingController(
                text: demoName,
              );

              final messageController =
                  TextEditingController(
                text: demoMessage,
              );

              await showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                showDragHandle: true,
                builder: (sheetContext) {
                  return StatefulBuilder(
                    builder:
                        (context, update) {
                      return Padding(
                        padding:
                            EdgeInsets.fromLTRB(
                          20,
                          0,
                          20,
                          MediaQuery.of(
                                    context,
                                  )
                                  .viewInsets
                                  .bottom +
                              25,
                        ),
                        child:
                            SingleChildScrollView(
                          child: Column(
                            mainAxisSize:
                                MainAxisSize.min,
                            crossAxisAlignment:
                                CrossAxisAlignment
                                    .start,
                            children: [
                              const Text(
                                'Demo Studio',
                                style:
                                    TextStyle(
                                  fontSize: 28,
                                  fontWeight:
                                      FontWeight
                                          .w900,
                                ),
                              ),

                              const SizedBox(
                                height: 5,
                              ),

                              const Text(
                                'Edite um personagem '
                                'fictício para testar '
                                'a interface.',
                                style:
                                    TextStyle(
                                  color:
                                      Colors.black54,
                                ),
                              ),

                              const SizedBox(
                                height: 22,
                              ),

                              Center(
                                child:
                                    GestureDetector(
                                  onTap:
                                      () async {
                                    final image =
                                        await ImagePicker()
                                            .pickImage(
                                      source:
                                          ImageSource
                                              .gallery,
                                      imageQuality: 80,
                                    );

                                    if (image ==
                                        null) {
                                      return;
                                    }

                                    update(() {
                                      demoImage =
                                          image.path;
                                    });

                                    setState(() {});
                                  },
                                  child:
                                      CircleAvatar(
                                    radius: 58,
                                    backgroundColor:
                                        const Color(
                                      0xFFFFD7E7,
                                    ),
                                    backgroundImage:
                                        demoImage !=
                                                null
                                            ? FileImage(
                                                File(
                                                  demoImage!,
                                                ),
                                              )
                                            : null,
                                    child:
                                        demoImage ==
                                                null
                                            ? const Icon(
                                                Icons
                                                    .add_a_photo_outlined,
                                                size: 38,
                                              )
                                            : null,
                                  ),
                                ),
                              ),

                              const SizedBox(
                                height: 22,
                              ),

                              TextField(
                                controller:
                                    nameController,
                                decoration:
                                    const InputDecoration(
                                  labelText:
                                      'Personagem fictício',
                                  prefixIcon:
                                      Icon(
                                    Icons
                                        .badge_outlined,
                                  ),
                                ),
                              ),

                              const SizedBox(
                                height: 12,
                              ),

                              TextField(
                                controller:
                                    messageController,
                                minLines: 2,
                                maxLines: 5,
                                decoration:
                                    const InputDecoration(
                                  labelText:
                                      'Mensagem simulada',
                                  prefixIcon:
                                      Icon(
                                    Icons
                                        .chat_bubble_outline_rounded,
                                  ),
                                ),
                              ),

                              const SizedBox(
                                height: 18,
                              ),

                              FilledButton.icon(
                                onPressed:
                                    () async {
                                  setState(() {
                                    demoName =
                                        nameController
                                                .text
                                                .trim()
                                                .isEmpty
                                            ? 'Nina'
                                            : nameController
                                                .text
                                                .trim();

                                    demoMessage =
                                        messageController
                                                .text
                                                .trim()
                                                .isEmpty
                                            ? 'Oi! Esta é '
                                                'uma mensagem '
                                                'simulada.'
                                            : messageController
                                                .text
                                                .trim();
                                  });

                                  await saveSettings();

                                  if (mounted) {
                                    Navigator.pop(
                                      sheetContext,
                                    );
                                  }
                                },
                                style:
                                    FilledButton
                                        .styleFrom(
                                  minimumSize:
                                      const Size
                                          .fromHeight(55),
                                ),
                                icon: const Icon(
                                  Icons.save_outlined,
                                ),
                                label: const Text(
                                  'Salvar demo',
                                ),
                              ),

                              const SizedBox(
                                height: 10,
                              ),

                              OutlinedButton.icon(
                                onPressed:
                                    sendDemoNotification,
                                style:
                                    OutlinedButton
                                        .styleFrom(
                                  minimumSize:
                                      const Size
                                          .fromHeight(53),
                                ),
                                icon: const Icon(
                                  Icons
                                      .notifications_active_outlined,
                                ),
                                label: const Text(
                                  'Testar notificação',
                                ),
                              ),

                              const SizedBox(
                                height: 8,
                              ),
                            ],
                          ),
                        ),
                      );
                    },
                  );
                },
              );
            }

            Future<void> swipe(
              bool liked,
            ) async {
              final width =
                  MediaQuery.of(context)
                      .size
                      .width;

              setState(() {
                drag = Offset(
                  liked
                      ? width * 1.5
                      : -width * 1.5,
                  20,
                );
              });

              await Future.delayed(
                const Duration(
                  milliseconds: 250,
                ),
              );

              if (!mounted) return;

              final match =
                  liked && current.isEven;

              setState(() {
                current =
                    (current + 1) %
                        people.length;

                drag = Offset.zero;
              });

              if (match) {
                showMatch();
              }
            }

            void showMatch() {
              showGeneralDialog(
                context: context,
                barrierDismissible: true,
                barrierLabel: 'Match demo',
                barrierColor:
                    Colors.black.withValues(
                  alpha: .72,
                ),
                transitionDuration:
                    const Duration(
                  milliseconds: 400,
                ),
                pageBuilder:
                    (_, __, ___) {
                  return Center(
                    child: Material(
                      color:
                          Colors.transparent,
                      child: Container(
                        margin:
                            const EdgeInsets
                                .all(28),
                        padding:
                            const EdgeInsets
                                .all(30),
                        decoration:
                            BoxDecoration(
                          color: Colors.white,
                          borderRadius:
                              BorderRadius
                                  .circular(34),
                        ),
                        child: Column(
                          mainAxisSize:
                              MainAxisSize.min,
                          children: [
                            const Icon(
                              Icons
                                  .favorite_rounded,
                              size: 82,
                              color: Color(
                                0xFFE83D8C,
                              ),
                            ),

                            const SizedBox(
                              height: 15,
                            ),

                            const Text(
                              'Match demo!',
                              style:
                                  TextStyle(
                                fontSize: 30,
                                fontWeight:
                                    FontWeight
                                        .w900,
                              ),
                            ),

                            const SizedBox(
                              height: 8,
                            ),

                            const Text(
                              'Este resultado é '
                              'fictício e existe '
                              'somente no protótipo.',
                              textAlign:
                                  TextAlign.center,
                              style:
                                  TextStyle(
                                color:
                                    Colors.black54,
                              ),
                            ),

                            const SizedBox(
                              height: 22,
                            ),

                            FilledButton.icon(
                              onPressed: () {
                                Navigator.pop(
                                  context,
                                );

                                setState(() {
                                  page = 2;
                                });
                              },
                              icon: const Icon(
                                Icons
                                    .chat_bubble_rounded,
                              ),
                              label:
                                  const Text(
                                'Abrir chat demo',
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  );
                },
                transitionBuilder:
                    (_, animation, __, child) {
                  return ScaleTransition(
                    scale:
                        CurvedAnimation(
                      parent: animation,
                      curve:
                          Curves.easeOutBack,
                    ),
                    child:
                        FadeTransition(
                      opacity: animation,
                      child: child,
                    ),
                  );
                },
              );
            }

            @override
            Widget build(
              BuildContext context,
            ) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor:
                      Colors.transparent,
                  title: Row(
                    children: [
                      Container(
                        width: 40,
                        height: 40,
                        decoration:
                            const BoxDecoration(
                          gradient:
                              LinearGradient(
                            colors: [
                              Color(
                                0xFFFF5BA4,
                              ),
                              Color(
                                0xFFD82D83,
                              ),
                            ],
                          ),
                          shape:
                              BoxShape.circle,
                        ),
                        child: const Icon(
                          Icons
                              .favorite_rounded,
                          color:
                              Colors.white,
                          size: 21,
                        ),
                      ),

                      const SizedBox(
                        width: 10,
                      ),

                      const Column(
                        crossAxisAlignment:
                            CrossAxisAlignment
                                .start,
                        children: [
                          Text(
                            'Luma',
                            style:
                                TextStyle(
                              fontWeight:
                                  FontWeight
                                      .w900,
                            ),
                          ),
                          Text(
                            'Ferraz • DEMO',
                            style:
                                TextStyle(
                              fontSize: 10,
                              color:
                                  Colors.black45,
                            ),
                          ),
                        ],
                      ),
                    ],
                  ),
                  actions: [
                    IconButton(
                      tooltip:
                          'Demo Studio',
                      onPressed:
                          openStudio,
                      icon: const Icon(
                        Icons.tune_rounded,
                      ),
                    ),
                  ],
                ),

                body:
                    AnimatedSwitcher(
                  duration:
                      const Duration(
                    milliseconds: 250,
                  ),
                  child:
                      switch (page) {
                    0 => discover(),
                    1 => likes(),
                    2 => chat(),
                    _ => profile(),
                  },
                ),

                bottomNavigationBar:
                    NavigationBar(
                  selectedIndex: page,
                  onDestinationSelected:
                      (value) {
                    setState(() {
                      page = value;
                    });
                  },
                  destinations:
                      const [
                    NavigationDestination(
                      icon: Icon(
                        Icons
                            .explore_outlined,
                      ),
                      selectedIcon:
                          Icon(
                        Icons
                            .explore_rounded,
                      ),
                      label:
                          'Descobrir',
                    ),
                    NavigationDestination(
                      icon: Icon(
                        Icons
                            .favorite_border_rounded,
                      ),
                      selectedIcon:
                          Icon(
                        Icons
                            .favorite_rounded,
                      ),
                      label:
                          'Curtidas',
                    ),
                    NavigationDestination(
                      icon: Icon(
                        Icons
                            .chat_bubble_outline_rounded,
                      ),
                      selectedIcon:
                          Icon(
                        Icons
                            .chat_bubble_rounded,
                      ),
                      label: 'Chat',
                    ),
                    NavigationDestination(
                      icon: Icon(
                        Icons
                            .person_outline_rounded,
                      ),
                      selectedIcon:
                          Icon(
                        Icons
                            .person_rounded,
                      ),
                      label: 'Perfil',
                    ),
                  ],
                ),
              );
            }

            Widget discover() {
              final person =
                  people[current];

              return Column(
                key: const ValueKey(
                  'discover',
                ),
                children: [
                  Expanded(
                    child: Padding(
                      padding:
                          const EdgeInsets
                              .fromLTRB(
                        16,
                        5,
                        16,
                        10,
                      ),
                      child:
                          LayoutBuilder(
                        builder:
                            (
                          context,
                          constraints,
                        ) {
                          return Stack(
                            alignment:
                                Alignment
                                    .center,
                            children: [
                              Transform.scale(
                                scale: .94,
                                child:
                                    profileCard(
                                  people[
                                      (current +
                                              1) %
                                          people
                                              .length],
                                  back: true,
                                ),
                              ),

                              GestureDetector(
                                onPanUpdate:
                                    (details) {
                                  setState(() {
                                    drag +=
                                        details
                                            .delta;
                                  });
                                },
                                onPanEnd:
                                    (_) {
                                  if (drag.dx >
                                      105) {
                                    swipe(true);
                                  } else if (
                                      drag.dx <
                                          -105) {
                                    swipe(false);
                                  } else {
                                    setState(() {
                                      drag =
                                          Offset
                                              .zero;
                                    });
                                  }
                                },
                                child:
                                    AnimatedContainer(
                                  duration: drag ==
                                          Offset
                                              .zero
                                      ? const Duration(
                                          milliseconds:
                                              280,
                                        )
                                      : Duration
                                          .zero,
                                  curve: Curves
                                      .easeOutBack,
                                  transform:
                                      Matrix4
                                          .identity()
                                        ..translate(
                                          drag.dx,
                                          drag.dy,
                                        )
                                        ..rotateZ(
