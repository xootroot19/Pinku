            Widget stamp(
              String text,
              Color color,
              double rotation,
            ) {
              return Transform.rotate(
                angle: rotation,
                child: Container(
                  padding:
                      const EdgeInsets
                          .symmetric(
                    horizontal: 14,
                    vertical: 7,
                  ),
                  decoration:
                      BoxDecoration(
                    border: Border.all(
                      color: color,
                      width: 3,
                    ),
                    borderRadius:
                        BorderRadius.circular(
                      9,
                    ),
                  ),
                  child: Text(
                    text,
                    style: TextStyle(
                      color: color,
                      fontSize: 20,
                      fontWeight:
                          FontWeight.w900,
                    ),
                  ),
                ),
              );
            }

            Widget action(
              IconData icon,
              Color color,
              VoidCallback onTap,
              double size,
            ) {
              return Material(
                color: Colors.white,
                elevation: 4,
                shape:
                    const CircleBorder(),
                child: InkWell(
                  customBorder:
                      const CircleBorder(),
                  onTap: onTap,
                  child: SizedBox(
                    width: size,
                    height: size,
                    child: Icon(
                      icon,
                      color: color,
                      size: size * .46,
                    ),
                  ),
                ),
              );
            }

