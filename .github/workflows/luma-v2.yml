          DART

      - name: Flutter pub get
        working-directory: luma_v2
        run: flutter pub get

      - name: Verificar codigo
        working-directory: luma_v2
        run: flutter analyze

      - name: Build APK
        working-directory: luma_v2
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Luma-V2-APK
          path: luma_v2/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
